name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  # Read the judged PR body and head live at run time rather than from the
  # frozen event payload. See bin/fm-pr-attestation-settle.sh.
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before: a
# further push supersedes a synchronize run still waiting for its attestation.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    # Backstop only: the wait below bounds itself. This keeps a hung live read
    # from holding a runner for the six-hour default.
    timeout-minutes: 35
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # GitHub takes this workflow's definition from head merged into base, so a
      # step added to main is live on every open pull request before any of them
      # rebases. Take the tree from that same place: the default checkout ref is
      # that merge commit, so the repository files a newly added step calls
      # arrive with it. Pinning ref: to the pull request head splits the pair -
      # the new step then runs against a tree that predates the script it calls,
      # and every branch based before that commit fails with a bare exit 127
      # until it rebases. Nothing in this job reads a head-only fact; the step
      # below resolves the head it judges from the forge.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The event payload pairs the just-pushed head with the body as it stood
      # before that push, so a synchronize run judged a moment that had already
      # passed and left a permanent red the later passing run never supersedes.
      # This resolves both facts from one live read instead. It renders no
      # verdict: the pair it hands over is judged by the action below exactly as
      # before, and a genuinely stale attestation still fails.
      - name: Resolve the live PR body and head
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT: ${{ github.event.action }}
        run: |
          set -eu
          settle=bin/fm-pr-attestation-settle.sh
          # Unreachable while the checkout above takes the default merge ref:
          # that tree always carries what main carries. This exists so that
          # re-pinning ref:, or any other split between this workflow's
          # definition and the tree it runs against, reports its cause instead
          # of exiting 127 naming nothing - which is how it failed the first
          # time, on a check whose whole purpose is to be trusted.
          if [ ! -x "$settle" ]; then
            echo "::error::$settle is absent from the checked-out tree, so this step cannot run."
            echo "This workflow's definition comes from head merged into base, but its files come from whatever ref the checkout step selects; those must be the same tree."
            echo "If the checkout above pins a ref:, remove it so the default merge ref is used."
            echo "If it does not, this branch predates the commit that added $settle - rebase it onto main."
            exit 1
          fi
          "$settle" \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --event "$PR_EVENT" \
            --output "$GITHUB_OUTPUT"
      - name: Verify no-mistakes signature and pipeline attestation
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@32d396ac0f29135daf7fcb9964aba9d5f4e796d6 # post-v1.57.1, untagged (action added in #819)
        with:
          pr-body: ${{ steps.live.outputs.body }}
          pr-head-sha: ${{ steps.live.outputs.head_sha }}
